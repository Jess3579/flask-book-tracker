{% extends 'base.html' %}

{% block content %}
<h2>Edit Book</h2>

<form method="POST" action="{{ url_for('main.edit_book', book_id=book.id) }}">
    <label>Title:</label>
    <input type="text" name="title" value="{{ book.title }}" required>

    <label>Author:</label>
    <input type="text" name="author" value="{{ book.author or '' }}">

    <label>Status:</label>
    <select name="status" required>
        <option value="Want to Read" {% if book.status == 'Want to Read' %}selected{% endif %}>Want to Read</option>
        <option value="Reading" {% if book.status == 'Reading' %}selected{% endif %}>Reading</option>
        <option value="Completed" {% if book.status == 'Completed' %}selected{% endif %}>Completed</option>
    </select>

    <label>Notes:</label>
    <textarea name="notes">{{ book.notes or '' }}</textarea>

    <button type="submit">Save Changes</button>
</form>
{% endblock %}
